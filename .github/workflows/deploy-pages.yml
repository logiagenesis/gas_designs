name: Deploy preview to GitHub Pages

on:
  push:
    branches: ["claude/tender-cori-3p8u59"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # GitHub Pages is static hosting, so there is no runtime for the contact
      # endpoint. It is removed before building rather than left to fail: with
      # `output: "export"` a route handler is a build error. The form itself
      # stays on the preview, visible but disabled — see NEXT_PUBLIC_PREVIEW.
      - name: Remove server-only API route (static preview cannot run it)
        run: rm -rf src/app/api

      - name: Build static export
        run: npx next build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_PREVIEW: "true"
          NEXT_PUBLIC_SITE_URL: https://logiagenesis.github.io/gas_designs

      # Without this, Pages runs Jekyll, which strips directories beginning
      # with an underscore — including Next's entire /_next asset tree.
      - run: touch out/.nojekyll

      # ONE-TIME PREREQUISITE, done by a repository admin:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      #
      # This step only reads that setting; it cannot create it. `enablement:
      # true` was tried and is refused with "Create Pages site failed: Resource
      # not accessible by integration" — creating a Pages site needs admin
      # rights that the workflow's GITHUB_TOKEN does not have, whatever
      # permissions the workflow requests.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
